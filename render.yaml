services:
  - type: web
    name: tata-1mg-people-desk
    runtime: python
    region: singapore  # In the same region as Neon (ap-southeast-1) for sub-10ms DB response
    plan: free         # Can be free or starter
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: NEON_HOST
        sync: false
      - key: NEON_USER
        sync: false
      - key: NEON_PASSWORD
        sync: false
      - key: NEON_DBNAME
        value: tata1mg_desk
      - key: ADMIN_EMAIL
        value: vaibhav.v1@1mg.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: vaibhav.v1@1mg.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Tata 1mg People Desk <vaibhav.v1@1mg.com>"

